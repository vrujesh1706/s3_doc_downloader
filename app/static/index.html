<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>S3 Document Downloader</title>
    <link rel="stylesheet" href="/static/styles.css?v=28" />
    <script>
      (function () {
        var saved = localStorage.getItem("theme");
        if (saved === "dark" || saved === "light") {
          document.documentElement.setAttribute("data-theme", saved);
        }
      })();
    </script>
  </head>
  <body>
    <main class="shell">
      <header class="page-head">
        <div>
          <h1>S3 Document Downloader</h1>
          <p class="page-sub">Find encounters, download their S3 outputs as a ZIP.</p>
        </div>
        <div class="head-actions">
          <label class="field field-inline" for="environment">
            <span class="field-label">Environment</span>
            <select id="environment">
              <option value="production" selected>Production</option>
              <option value="staging">Staging</option>
            </select>
          </label>
          <button id="themeToggleBtn" class="btn btn-icon" type="button" title="Toggle dark mode" aria-label="Toggle dark mode">🌙</button>
          <button id="downloadBtn" class="btn btn-success" type="button" disabled>
            Download ZIP <span id="downloadCount" class="btn-count"></span>
          </button>
        </div>
      </header>

      <section class="card">
        <div class="tabs" id="modeTabs" role="tablist">
          <button type="button" class="mode-tab is-active" data-mode="direct" role="tab" aria-selected="true">
            Direct client lookup
          </button>
          <button type="button" class="mode-tab" data-mode="common" role="tab" aria-selected="false">
            Find by metadata
          </button>
        </div>

        <p class="mode-hint" id="modeHint"></p>

        <div class="filter-grid" id="directFilters">
          <label class="field">
            <span class="field-label">Client</span>
            <select id="client">
              <option value="">Select a client…</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Account numbers <span class="hint">or encounter IDs, not both</span></span>
            <textarea id="account_numbers" placeholder="9619150-720680, 4599278-449254"></textarea>
          </label>
          <label class="field">
            <span class="field-label">Encounter IDs <span class="hint">or account numbers, not both</span></span>
            <textarea id="encounter_ids" placeholder="37750838, 37738090"></textarea>
          </label>
        </div>

        <div class="filter-grid" id="commonFilters" hidden>
          <label class="field">
            <span class="field-label">Service date range <span class="hint">ignored if From/To is set</span></span>
            <select id="date_range">
              <option value="any" selected>Any date</option>
              <option value="today">Today</option>
              <option value="yesterday">Yesterday</option>
              <option value="last_7_days">Last 7 days</option>
              <option value="last_30_days">Last 30 days</option>
              <option value="this_week">This week</option>
              <option value="last_week">Last week</option>
              <option value="this_month">This month</option>
              <option value="last_month">Last month</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">From <span class="hint">overrides the service date range; needs To as well</span></span>
            <input id="date_from" type="date" />
          </label>
          <label class="field">
            <span class="field-label">To <span class="hint">overrides the service date range; needs From as well</span></span>
            <input id="date_to" type="date" />
          </label>
          <label class="field">
            <span class="field-label">Client code <span class="hint">required — pick “All clients” for every one</span></span>
            <select id="client_codes">
              <option value="">Select a client…</option>
            </select>
          </label>
          <label class="field">
            <span class="field-label">Facility code <span class="hint">required — pick “All facilities” for every one</span></span>
            <select id="facility_codes" disabled>
              <option value="">Select a client first</option>
            </select>
          </label>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>File outputs</h2>
          <span class="head-note">Pick at least one — nothing is included by default</span>
          <div class="mini-actions">
            <button id="selectAllBtn" class="btn btn-sm" type="button">All</button>
            <button id="clearFilesBtn" class="btn btn-sm" type="button">Clear</button>
          </div>
        </div>
        <div id="fileTypes" class="file-grid"></div>
      </section>

      <section class="card runbar">
        <label class="field">
          <span class="field-label">Folder structure</span>
          <select id="folder_structure">
            <option value="single_folder" selected>One folder</option>
            <option value="facility_wise">Facility wise</option>
          </select>
        </label>
        <button id="searchBtn" class="btn btn-primary" type="button">Search</button>
        <div class="run-status" aria-live="polite">
          <span id="spinner" class="spinner" hidden></span>
          <span id="status" role="status"></span>
        </div>
        <div id="progressBar" class="progress-bar" hidden>
          <div class="progress-track"><div id="progressFill" class="progress-fill"></div></div>
          <span id="progressCount" class="progress-count"></span>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <h2>Results</h2>
          <span id="resultCount" class="head-note">No search yet</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><input id="toggleRows" type="checkbox" aria-label="Select all rows" /></th>
                <th>Account</th>
                <th>Encounter</th>
                <th>Client</th>
                <th>Facility</th>
                <th>Service date</th>
                <th>Multi-doc</th>
                <th>Files to download</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
        <div id="pagination" class="pagination" hidden>
          <label class="page-size">
            <span>Rows per page</span>
            <select id="pageSize">
              <option value="10">10</option>
              <option value="25" selected>25</option>
              <option value="50">50</option>
              <option value="100">100</option>
            </select>
          </label>
          <div class="page-controls">
            <span id="pageInfo" class="page-info"></span>
            <button id="prevPage" class="btn btn-sm" type="button">Prev</button>
            <button id="nextPage" class="btn btn-sm" type="button">Next</button>
          </div>
        </div>
      </section>
    </main>
    <script src="/static/app.js?v=28"></script>
  </body>
</html>
